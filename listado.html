<body class="bg-black text-white min-h-screen flex flex-col">

  <!-- HEADER (igual en todas las páginas: sidebar, buscador+botón, carrito, admin) -->

  <!-- CARRITO LATERAL -->

        <img src="images/Logo.png" alt="Logo EPHEMERAL" class="h-8 object-contain">

        <p class="text-xs text-gray-600">Calidad • Estilo • Exclusividad</p>
        <div class="mt-1 flex items-center justify-center gap-2">
          <a href="https://instagram.com/ephemeral_gym_clothes" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1 group transition">

  <script>
    let todosLosProductos = [];
    let carrito = JSON.parse(sessionStorage.getItem('carrito')) || [];
    let categoriaActiva = 'todos';
    let seccionActiva = 'todos';
    let modoFavoritos = false;
    let usuarioActual = null;
    let favoritosUsuario = [];
    let seccionesPersonalizadas = []; // [{id, nombre, clave}] cargadas desde Firestore

    const SECCIONES_FIJAS = [
      { clave: 'hombre', nombre: 'Hombre' },
      { clave: 'mujer', nombre: 'Mujer' },
      { clave: 'accesorios', nombre: 'Accesorios' }
    ];

    // Compatibilidad con productos viejos (campo "seccion" string) y arreglo del valor
    // viejo "accesorio" (singular) -> "accesorios" (plural, el que usa el resto del sitio).
    function normalizarClaveSeccion(clave) {
      return clave === 'accesorio' ? 'accesorios' : clave;
    }

    function obtenerSeccionesDeProducto(producto) {
      const arr = Array.isArray(producto.secciones)
        ? producto.secciones
        : (producto.seccion ? [producto.seccion] : []);
      return arr.map(normalizarClaveSeccion);
    }

    // ===== CARGA INICIAL =====
    async function cargarProductos() {
      try {
        const [snapshotProductos, snapshotSecciones] = await Promise.all([
          db.collection('productos').get(),
          db.collection('secciones').get()
        ]);
        todosLosProductos = snapshotProductos.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        seccionesPersonalizadas = snapshotSecciones.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        generarCategorias();
        generarBotonesSeccion();
        leerParametrosURL();
        filtrarProductos();
        actualizarCarritoUI();
      } catch (error) {
        console.error('Error al cargar productos:', error);
      }
    }

    // Genera los botones de sección: fijas (Hombre/Mujer/Accesorios) + las personalizadas
    // que el admin haya creado (ej. "Nuevo Drop"). "Todos" ya está fijo en el HTML.
    function generarBotonesSeccion() {
      const contenedor = document.getElementById('filtrosSeccion');
      const todasLasSecciones = [
        ...SECCIONES_FIJAS,
        ...seccionesPersonalizadas.map(s => ({ clave: s.clave, nombre: s.nombre }))
      ];

      todasLasSecciones.forEach(s => {
        contenedor.insertAdjacentHTML('beforeend', `
          <button onclick="filtrarSeccion('${s.clave}')" data-sec="${s.clave}" class="seccion-btn px-4 py-2 rounded-full text-sm font-medium bg-zinc-800 text-white transition">
            ${s.nombre}
          </button>`);
      });
    }

    // Lee ?categoria=, ?seccion= y ?buscar= de la URL (así index.html y producto.html
    // pueden mandar aquí con un filtro ya aplicado)
    function leerParametrosURL() {
      const params = new URLSearchParams(window.location.search);
      const cat = params.get('categoria');
      const sec = params.get('seccion');
      const buscar = params.get('buscar');
      const favoritos = params.get('favoritos');

      if (buscar) {
        document.getElementById('inputBuscador').value = buscar;
        document.getElementById('inputBuscadorMovil').value = buscar;
      }
      if (sec) seccionActiva = sec;
      if (cat) categoriaActiva = cat;
      if (favoritos === '1') modoFavoritos = true;

      marcarCategoriaActiva(modoFavoritos ? 'favoritos' : categoriaActiva);
      marcarSeccionActiva(seccionActiva);
    }

    function generarCategorias() {
      const categorias = [...new Set(todosLosProductos.map(p => p.categoria))];
      const listaDesktop = document.getElementById('listaCategorias');
      const listaMovil = document.getElementById('listaCategoriasMovil');

      let htmlMovil = `<li><button onclick="filtrarCategoria('todos'); toggleMenuMovil()" data-cat="todos" class="categoria-btn-movil w-full text-left px-3 py-2 rounded-lg bg-white text-black transition text-sm font-medium">Todos</button></li>
        <li id="liFavoritosMovil" style="display: none;"><button onclick="mostrarFavoritos(); toggleMenuMovil()" data-cat="favoritos" class="categoria-btn-movil w-full text-left px-3 py-2 rounded-lg bg-transparent hover:bg-zinc-800 transition text-sm font-medium text-white">❤️ Favoritos</button></li>`;

      categorias.forEach(cat => {
        const nombreBonito = cat.charAt(0).toUpperCase() + cat.slice(1);
        listaDesktop.innerHTML += `
          <li>
            <button onclick="filtrarCategoria('${cat}')" data-cat="${cat}" class="categoria-btn w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 transition text-sm font-medium text-black">
              ${nombreBonito}
            </button>
          </li>`;
        htmlMovil += `
          <li>
            <button onclick="filtrarCategoria('${cat}'); toggleMenuMovil()" data-cat="${cat}" class="categoria-btn-movil w-full text-left px-3 py-2 rounded-lg bg-transparent hover:bg-zinc-800 transition text-sm font-medium text-white">
              ${nombreBonito}
            </button>
          </li>`;
      });

      listaMovil.innerHTML = htmlMovil;
      actualizarVisibilidadFavoritos();
    }

    // ===== FILTROS (categoría + sección se combinan; búsqueda y favoritos los sustituyen) =====
    function marcarCategoriaActiva(categoria) {
      document.querySelectorAll('.categoria-btn').forEach(btn => {
        btn.classList.remove('bg-gray-100');
        if (btn.dataset.cat === categoria) btn.classList.add('bg-gray-100');
      });
      document.querySelectorAll('.categoria-btn-movil').forEach(btn => {
        btn.classList.remove('bg-white', 'text-black');
        btn.classList.add('bg-transparent', 'text-white');
        if (btn.dataset.cat === categoria) {
          btn.classList.remove('bg-transparent', 'text-white');
          btn.classList.add('bg-white', 'text-black');
        }
      });
    }

    function marcarSeccionActiva(seccion) {
      document.querySelectorAll('.seccion-btn').forEach(btn => {
        btn.classList.remove('bg-white', 'text-black');
        btn.classList.add('bg-zinc-800', 'text-white');
        if (btn.dataset.sec === seccion) {
          btn.classList.remove('bg-zinc-800', 'text-white');
          btn.classList.add('bg-white', 'text-black');
        }
      });
    }

    function filtrarCategoria(categoria) {
      categoriaActiva = categoria;
      modoFavoritos = false;
      limpiarBusqueda();
      marcarCategoriaActiva(categoria);
      filtrarProductos();
    }

    function filtrarSeccion(seccion) {
      seccionActiva = seccion;
      modoFavoritos = false;
      limpiarBusqueda();
      marcarSeccionActiva(seccion);
      filtrarProductos();
    }

    function mostrarFavoritos() {
      if (!usuarioActual) {
        alert('Inicia sesión para ver tus favoritos.');
        return;
      }
      modoFavoritos = true;
      limpiarBusqueda();
      marcarCategoriaActiva('favoritos');
      filtrarProductos();
    }

    function limpiarBusqueda() {
      document.getElementById('inputBuscador').value = '';
      document.getElementById('inputBuscadorMovil').value = '';
      ocultarSugerencias();
    }

    function normalizarTexto(str) {
      return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function obtenerTextoBusqueda() {
      return document.getElementById('inputBuscador').value ||
             document.getElementById('inputBuscadorMovil').value || '';
    }

    // Botón 🔍: si ya estamos en listado.html, solo confirma el filtro y oculta sugerencias.
    // Esta misma función se reutilizará en index.html/producto.html para MANDAR a listado.html.
    function irABuscar() {
      const texto = obtenerTextoBusqueda().trim();
      ocultarSugerencias();
      if (!texto) return;
      filtrarProductos();
    }

    function filtrarProductos() {
      const textoBusquedaCrudo = obtenerTextoBusqueda();
      const textoBusqueda = normalizarTexto(textoBusquedaCrudo);

      let filtrados = todosLosProductos;

      if (textoBusqueda) {
        filtrados = filtrados.filter(p => normalizarTexto(p.nombre).includes(textoBusqueda));
        mostrarSugerencias(filtrados, textoBusqueda);
      } else {
        ocultarSugerencias();
        if (modoFavoritos) {
          filtrados = filtrados.filter(p => favoritosUsuario.includes(p.id));
        } else {
          if (seccionActiva !== 'todos') {
            filtrados = filtrados.filter(p => obtenerSeccionesDeProducto(p).includes(seccionActiva));
          }
          if (categoriaActiva !== 'todos') filtrados = filtrados.filter(p => p.categoria === categoriaActiva);
        }
      }

      renderizarProductos(filtrados);
      actualizarURL(textoBusquedaCrudo);
    }

    function actualizarURL(textoBusqueda) {
      const params = new URLSearchParams();
      if (categoriaActiva !== 'todos' && !textoBusqueda) params.set('categoria', categoriaActiva);
      if (seccionActiva !== 'todos' && !textoBusqueda) params.set('seccion', seccionActiva);
      if (textoBusqueda) params.set('buscar', textoBusqueda);
      const query = params.toString();
      history.replaceState(null, '', query ? `?${query}` : window.location.pathname);
    }

    function mostrarSugerencias(filtrados, textoBusqueda) {
      const resultados = filtrados.slice(0, 6);
      ['sugerenciasBuscador', 'sugerenciasBuscadorMovil'].forEach(contenedorId => {
        const contenedor = document.getElementById(contenedorId);
        if (!contenedor) return;
        if (resultados.length === 0) {
          contenedor.innerHTML = `<p class="text-sm text-gray-500 p-3">Sin resultados para "${textoBusqueda}"</p>`;
        } else {
          contenedor.innerHTML = resultados.map(p => `
            <div onclick="window.location.href='producto.html?id=${p.id}'"
                 class="flex items-center gap-3 p-2 hover:bg-gray-100 cursor-pointer border-b border-gray-100 last:border-b-0">
              <img src="${p.imagenes[0]}" class="w-10 h-10 object-cover rounded">
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-black truncate">${p.nombre}</p>
                <p class="text-xs text-gray-500">$${p.precio} MXN</p>
              </div>
            </div>
          `).join('');
        }
        contenedor.classList.remove('hidden');
      });
    }

    function ocultarSugerencias() {
      const d = document.getElementById('sugerenciasBuscador');
      const m = document.getElementById('sugerenciasBuscadorMovil');
      if (d) d.classList.add('hidden');
      if (m) m.classList.add('hidden');
    }

    // ===== RENDER DE PRODUCTOS =====
    function renderizarProductos(productos) {
      const container = document.getElementById('productos-container');
      const sinResultados = document.getElementById('sinResultados');

      container.innerHTML = '';

      if (productos.length === 0) {
        sinResultados.classList.remove('hidden');
        return;
      }
      sinResultados.classList.add('hidden');

      productos.forEach(producto => {
        const esFavorito = favoritosUsuario.includes(producto.id);
        container.innerHTML += `
          <div class="bg-zinc-900 rounded-xl shadow-lg p-3 hover:scale-105 transition duration-300">
            <div class="relative cursor-pointer" onclick="window.location.href='producto.html?id=${producto.id}'">
              <img src="${producto.imagenes[0]}"
                   alt="${producto.nombre}"
                   loading="lazy"
                   class="rounded-lg mb-3 w-full h-[220px] object-cover">
              <button onclick="event.stopPropagation(); toggleFavorito('${producto.id}', this)"
                      class="favorito-btn absolute top-2 right-2 w-8 h-8 rounded-full bg-black/50 flex items-center justify-center text-lg">
                ${esFavorito ? '❤️' : '🤍'}
              </button>
            </div>

            <h3 class="text-base font-semibold truncate cursor-pointer" onclick="window.location.href='producto.html?id=${producto.id}'">${producto.nombre}</h3>
            <p class="text-gray-400 text-sm mb-2">$${producto.precio} MXN</p>

            <div class="flex gap-2">
              <button onclick='agregarAlCarritoRapido(${JSON.stringify(producto)})' class="flex-1 bg-zinc-700 hover:bg-zinc-600 transition text-white px-2 py-2 rounded-lg text-xs font-semibold">
                Añadir
              </button>
              <button onclick="window.location.href='producto.html?id=${producto.id}'" class="flex-1 bg-green-500 hover:bg-green-600 transition text-white px-2 py-2 rounded-lg text-xs font-semibold">
                Compra ya
              </button>
            </div>
          </div>`;
      });
    }

    function agregarAlCarritoRapido(producto) {
      let talla = 'Única';
      let stockDisponible = producto.stock || 0;

      if (producto.tallas && producto.tallas.length > 0 && typeof producto.tallas[0] === 'object') {
        const tallaConStock = producto.tallas.find(t => t.stock > 0);
        if (!tallaConStock) {
          alert('Este producto no tiene stock disponible en ninguna talla.');
          return;
        }
        talla = tallaConStock.nombre;
        stockDisponible = tallaConStock.stock;
      }

      const claveUnica = `${producto.id}-${talla}`;
      const existente = carrito.find(item => item.claveUnica === claveUnica);

      if (existente) {
        if (existente.cantidad >= stockDisponible) {
          alert(`Ya tienes el máximo disponible (${stockDisponible}) de "${producto.nombre}" (talla ${talla}) en tu carrito.`);
          return;
        }
        existente.cantidad += 1;
      } else {
        carrito.push({
          id: producto.id,
          nombre: producto.nombre,
          precio: producto.precio,
          imagenes: producto.imagenes,
          talla: talla,
          cantidad: 1,
          claveUnica
        });
      }
      guardarCarrito();
      actualizarCarritoUI();
      toggleCarrito();
    }

    // ===== FAVORITOS =====
    async function cargarFavoritos() {
      if (!usuarioActual) { favoritosUsuario = []; return; }
      try {
        const snapshot = await db.collection('usuarios').doc(usuarioActual.uid).collection('favoritos').get();
        favoritosUsuario = snapshot.docs.map(doc => doc.id);
      } catch (error) {
        console.error('Error al cargar favoritos:', error);
        favoritosUsuario = [];
      }
    }

    async function toggleFavorito(productoId, btn) {
      if (!usuarioActual) {
        if (confirm('Necesitas iniciar sesión para guardar favoritos. ¿Iniciar sesión ahora?')) {
          iniciarSesionGoogle();
        }
        return;
      }

      const ref = db.collection('usuarios').doc(usuarioActual.uid).collection('favoritos').doc(productoId);
      const yaEsFavorito = favoritosUsuario.includes(productoId);

      try {
        if (yaEsFavorito) {
          await ref.delete();
          favoritosUsuario = favoritosUsuario.filter(id => id !== productoId);
          btn.textContent = '🤍';
        } else {
          await ref.set({ fecha: firebase.firestore.FieldValue.serverTimestamp() });
          favoritosUsuario.push(productoId);
          btn.textContent = '❤️';
        }
        if (modoFavoritos) filtrarProductos();
      } catch (error) {
        alert('Error al actualizar favoritos: ' + error.message);
      }
    }

    function actualizarVisibilidadFavoritos() {
      const liDesktop = document.getElementById('liFavoritosDesktop');
      const liMovil = document.getElementById('liFavoritosMovil');
      const visible = usuarioActual ? '' : 'none';
      if (liDesktop) liDesktop.style.display = visible;
      if (liMovil) liMovil.style.display = visible;
    }

    // ===== CARRITO =====
    function quitarDelCarrito(clave) {
      carrito = carrito.filter(item => (item.claveUnica || item.id) !== clave);
      guardarCarrito();
      actualizarCarritoUI();
    }

    function obtenerStockLocal(productoId, talla) {
      const producto = todosLosProductos.find(p => p.id === productoId);
      if (!producto) return null;
      if (producto.tallas && producto.tallas.length > 0 && typeof producto.tallas[0] === 'object') {
        const t = producto.tallas.find(t => t.nombre === talla);
        return t ? t.stock : 0;
      }
      return producto.stock || 0;
    }

    function cambiarCantidad(clave, delta) {
      const item = carrito.find(i => (i.claveUnica || i.id) === clave);
      if (!item) return;

      if (delta > 0) {
        const stock = obtenerStockLocal(item.id, item.talla);
        if (stock !== null && item.cantidad >= stock) {
          alert(`No hay más stock disponible de "${item.nombre}" (talla ${item.talla}). Stock: ${stock}.`);
          return;
        }
      }

      item.cantidad += delta;
      if (item.cantidad <= 0) {
        quitarDelCarrito(clave);
      } else {
        guardarCarrito();
        actualizarCarritoUI();
      }
    }

    function guardarCarrito() {
      sessionStorage.setItem('carrito', JSON.stringify(carrito));
    }

    function actualizarCarritoUI() {
      const contador = document.getElementById('contadorCarrito');
      const totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
      contador.textContent = totalItems;

      const carritoItems = document.getElementById('carritoItems');
      const carritoVacio = document.getElementById('carritoVacio');
      const carritoTotal = document.getElementById('carritoTotal');

      if (carrito.length === 0) {
        carritoItems.innerHTML = '';
        carritoVacio.classList.remove('hidden');
        carritoTotal.classList.add('hidden');
        return;
      }

      carritoVacio.classList.add('hidden');
      carritoTotal.classList.remove('hidden');

      let total = 0;
      carritoItems.innerHTML = carrito.map(item => {
        total += item.precio * item.cantidad;
        return `
          <div class="flex gap-3 items-center bg-zinc-800 rounded-lg p-3">
            <img src="${item.imagenes[0]}" class="w-16 h-16 object-cover rounded">
            <div class="flex-1">
              <p class="text-sm font-medium">${item.nombre}</p>
              <p class="text-xs text-gray-400">Talla: ${item.talla || 'Única'} · $${item.precio} MXN</p>
              <div class="flex items-center gap-2 mt-1">
                <button onclick="cambiarCantidad('${item.claveUnica || item.id}', -1)" class="bg-zinc-700 w-6 h-6 rounded text-sm">-</button>
                <span class="text-sm">${item.cantidad}</span>
                <button onclick="cambiarCantidad('${item.claveUnica || item.id}', 1)" class="bg-zinc-700 w-6 h-6 rounded text-sm">+</button>
              </div>
            </div>
            <button onclick="quitarDelCarrito('${item.claveUnica || item.id}')" class="text-red-500 text-sm">✕</button>
          </div>`;
      }).join('');

      document.getElementById('totalPrecio').textContent = `$${total} MXN`;
    }

    function toggleCarrito() {
      document.getElementById('carritoOverlay').classList.toggle('hidden');
    }

    function toggleMenuMovil() {
      document.getElementById('sidebarMovil').classList.toggle('hidden');
    }

    // ===== LOGIN =====
    function iniciarSesionGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(error => console.error('Error al iniciar sesión:', error));
    }

    function cerrarSesionUsuario() {
      auth.signOut();
    }

    auth.onAuthStateChanged(user => {
      usuarioActual = user;

      const linkAdmin = document.getElementById('linkAdmin');
      if (user && user.email === 'ephemeralpagweb@gmail.com') {
        linkAdmin.classList.remove('hidden');
      } else {
        linkAdmin.classList.add('hidden');
      }

      const btnLogin = document.getElementById('btnLogin');
      const usuarioInfo = document.getElementById('usuarioInfo');
      const fotoUsuario = document.getElementById('fotoUsuario');
      const nombreUsuario = document.getElementById('nombreUsuario');

      const btnLoginMovil = document.getElementById('btnLoginMovil');
      const usuarioInfoMovil = document.getElementById('usuarioInfoMovil');
      const fotoUsuarioMovil = document.getElementById('fotoUsuarioMovil');
      const nombreUsuarioMovil = document.getElementById('nombreUsuarioMovil');

      if (user) {
        btnLogin.classList.add('hidden');
        usuarioInfo.classList.remove('hidden');
        usuarioInfo.classList.add('flex');
        fotoUsuario.src = user.photoURL || 'images/Logo.png';
        nombreUsuario.textContent = user.displayName || user.email;

        btnLoginMovil.classList.add('hidden');
        usuarioInfoMovil.classList.remove('hidden');
        usuarioInfoMovil.classList.add('flex');
        fotoUsuarioMovil.src = user.photoURL || 'images/Logo.png';
        nombreUsuarioMovil.textContent = user.displayName || user.email;
      } else {
        btnLogin.classList.remove('hidden');
        usuarioInfo.classList.add('hidden');
        usuarioInfo.classList.remove('flex');

        btnLoginMovil.classList.remove('hidden');
        usuarioInfoMovil.classList.add('hidden');
        usuarioInfoMovil.classList.remove('flex');

        if (modoFavoritos) {
          modoFavoritos = false;
          marcarCategoriaActiva('todos');
        }
      }

      actualizarVisibilidadFavoritos();
      cargarFavoritos().then(() => {
        if (todosLosProductos.length > 0) filtrarProductos();
      });
    });

    document.getElementById('btnMenuMovil').addEventListener('click', toggleMenuMovil);

    document.addEventListener('click', (e) => {
      const dentroDesktop = document.getElementById('inputBuscador')?.parentElement.contains(e.target);
      const dentroMovil = document.getElementById('inputBuscadorMovil')?.parentElement.contains(e.target);
      if (!dentroDesktop && !dentroMovil) ocultarSugerencias();
    });

    window.addEventListener('DOMContentLoaded', cargarProductos);
  </script>

</body>
</html>
