</head>

<body class="bg-black text-white min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-white shadow-md py-4 border-b border-zinc-800 sticky top-0 z-40 md:pl-16">
    <div class="max-w-7xl mx-auto flex items-center justify-between px-4 gap-4">

      <button id="btnMenuMovil" class="md:hidden text-black text-2xl">☰</button>

      <div class="flex-1 flex justify-center">

      <div class="flex items-center gap-4">
        <a href="listado.html" class="text-black text-2xl" title="Buscar productos">🔍</a>
        <a href="admin.html" id="linkAdmin" class="hidden text-black text-xl" title="Panel Admin">⚙️</a>
        <button onclick="toggleCarrito()" class="relative text-black text-2xl">
          🛒
          <span id="contadorCarrito" class="absolute -top-2 -right-2 bg-green-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>

  <div class="flex flex-1 md:pl-16">

    <!-- SIDEBAR CATEGORÍAS (hover en desktop) -->

      <div class="flex md:group-hover:hidden justify-center items-center h-12 mb-4">

      </div>
      <h2 class="text-sm font-semibold text-gray-500 uppercase mb-4 whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity duration-200">
        Categorías
      </h2>
      <ul id="listaCategorias" class="space-y-2 hidden group-hover:block">
        <li>
          <a href="listado.html" data-cat="todos" class="categoria-btn w-full block text-left px-3 py-2 rounded-lg hover:bg-gray-100 transition text-sm font-medium text-black whitespace-nowrap">
            Todos
          </a>
        </li>
        <li id="liFavoritosDesktop" style="display: none;">
          <button onclick="irAFavoritos()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 transition text-sm font-medium text-black whitespace-nowrap">
            ❤️ Favoritos

        </li>
      </ul>

      <div class="mt-auto pt-4 border-t border-gray-200">
        <button id="btnLogin" onclick="iniciarSesionGoogle()" class="w-full flex items-center gap-3 px-1 py-2 rounded-lg hover:bg-gray-100 transition text-sm font-medium text-black whitespace-nowrap">
          <span class="text-xl">👤</span>
          <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-200">Iniciar sesión</span>
        </button>
        <div id="usuarioInfo" class="hidden items-center gap-2 px-1 py-2 cursor-pointer" onclick="window.location.href='cuenta.html'">
          <img id="fotoUsuario" class="w-8 h-8 rounded-full flex-shrink-0" src="">
          <div class="whitespace-nowrap overflow-hidden opacity-0 group-hover:opacity-100 transition-opacity duration-200">
            <p id="nombreUsuario" class="text-xs font-medium text-black truncate"></p>
            <span class="text-xs text-gray-500 hover:underline">Mi cuenta</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Sidebar móvil (overlay) -->
    <div id="sidebarMovil" class="hidden fixed inset-0 bg-black/70 z-50 md:hidden" onclick="toggleMenuMovil()">
      <aside class="w-64 bg-zinc-900 h-full p-4 overflow-y-auto flex flex-col" onclick="event.stopPropagation()">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-sm font-semibold text-gray-400 uppercase">Categorías</h2>
          <button onclick="toggleMenuMovil()" class="text-white text-xl">✕</button>
        </div>
        <ul id="listaCategoriasMovil" class="space-y-2">
          <li>
            <a href="listado.html" class="w-full block text-left px-3 py-2 rounded-lg hover:bg-zinc-800 transition text-sm font-medium text-white">
              Todos
            </a>
          </li>
          <li id="liFavoritosMovil" style="display: none;">
            <button onclick="irAFavoritos()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-zinc-800 transition text-sm font-medium text-white">
              ❤️ Favoritos
            </button>
          </li>
        </ul>

        <div class="mt-auto pt-4 border-t border-zinc-700">
          <button id="btnLoginMovil" onclick="iniciarSesionGoogle()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-zinc-800 transition text-sm font-medium text-white">
            👤 Iniciar sesión
          </button>
          <div id="usuarioInfoMovil" class="hidden items-center gap-2 px-3 py-2 cursor-pointer" onclick="window.location.href='cuenta.html'">
            <img id="fotoUsuarioMovil" class="w-8 h-8 rounded-full flex-shrink-0" src="">
            <div class="overflow-hidden">
              <p id="nombreUsuarioMovil" class="text-xs font-medium text-white truncate"></p>
              <span class="text-xs text-gray-400 hover:underline">Mi cuenta</span>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <!-- CONTENIDO PRINCIPAL: BIENVENIDA -->
    <main class="flex-1 min-w-0">

      <!-- HERO -->
      <div class="w-full bg-black flex flex-col items-center justify-center">
        <img src="images/InicioEphemeral.jpeg" alt="EPHEMERAL" class="block md:hidden w-full h-[85vh] object-cover">
        <img src="images/InicioEphemeralPC.png" alt="EPHEMERAL" class="hidden md:block w-full max-w-6xl px-6 py-8 h-auto object-contain">
        <div class="pb-6 md:pb-10 flex flex-col items-center gap-2 text-center px-4">
          <p class="text-xs md:text-sm tracking-[0.2em] uppercase text-gray-300">Conoce nuestras secciones</p>
          <div class="text-white text-2xl animate-bounce">↓</div>
        </div>
      </div>

      <!-- SECCIONES CON CARRUSEL -->
      <div id="contenedorSecciones" class="py-10 space-y-14">
        <!-- Se generan dinámicamente: Hombres, Mujeres, Accesorios -->
      </div>

    </main>

  </div>

  <!-- CARRITO LATERAL -->
  <div id="carritoOverlay" class="hidden fixed inset-0 bg-black/70 z-50" onclick="toggleCarrito()">
    <div class="absolute right-0 top-0 w-full sm:w-96 h-full bg-zinc-900 p-6 overflow-y-auto" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold">Tu Carrito</h2>
        <button onclick="toggleCarrito()" class="text-2xl">✕</button>
      </div>

      <div id="carritoItems" class="space-y-4"></div>

      <p id="carritoVacio" class="text-gray-500 text-center mt-6">Tu carrito está vacío</p>

      <div id="carritoTotal" class="hidden mt-6 border-t border-zinc-700 pt-4">
        <div class="flex justify-between text-lg font-semibold mb-4">
          <span>Total:</span>
          <span id="totalPrecio">$0 MXN</span>
        </div>
        <button onclick="window.location.href='pedido.html'" class="w-full bg-green-500 hover:bg-green-600 transition text-white py-3 rounded-lg font-semibold">
          Finalizar pedido
        </button>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="bg-white text-black border-t border-gray-200">
    <div class="max-w-7xl mx-auto px-4 py-4 grid grid-cols-1 md:grid-cols-3 items-center text-center gap-3">
      <div class="flex justify-center md:justify-start">
        <img src="images/Logo.png" alt="Logo EPHEMERAL" class="h-8 object-contain">
      </div>
      <div>
        <h3 class="text-sm font-semibold tracking-wide">EPHEMERAL</h3>
        <p class="text-xs text-gray-600">Calidad • Estilo • Exclusividad</p>
        <div class="mt-1 flex items-center justify-center gap-2">
          <a href="https://instagram.com/ephemeral_gym_clothes" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1 group transition">
            <img src="images/LogoInsta.png" alt="Instagram EPHEMERAL" class="h-4 w-4 object-contain">
            <span class="text-xs text-gray-700 font-medium border-b border-transparent group-hover:border-black transition duration-300">
              ephemeral_gym_clothes
            </span>
          </a>
        </div>
      </div>
      <div class="flex justify-center md:justify-end">
        <img src="images/LogoLetras.png" alt="Logo letras EPHEMERAL" class="h-8 object-contain">
      </div>
    </div>
  </footer>

  <script>
    let todosLosProductos = [];
    let carrito = JSON.parse(sessionStorage.getItem('carrito')) || [];
    let usuarioActual = null;
    let favoritosUsuario = [];

    const SECCIONES = [
      { clave: 'hombre', titulo: 'Hombres' },
      { clave: 'mujer', titulo: 'Mujeres' },
      { clave: 'accesorios', titulo: 'Accesorios' }
    ];

    async function cargarProductos() {
      try {
        const snapshot = await db.collection('productos').get();
        todosLosProductos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderizarSecciones();
        actualizarCarritoUI();
      } catch (error) {
        console.error('Error al cargar productos:', error);
      }
    }

    function renderizarSecciones() {
      const contenedor = document.getElementById('contenedorSecciones');
      contenedor.innerHTML = '';

      SECCIONES.forEach(seccion => {
        const productosSeccion = todosLosProductos.filter(p => p.seccion === seccion.clave);
        if (productosSeccion.length === 0) return;

        const idCarrusel = `carrusel-${seccion.clave}`;

        const bloque = document.createElement('div');
        bloque.innerHTML = `
          <div class="max-w-7xl mx-auto px-4 md:px-8">
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-2xl md:text-3xl font-bold">${seccion.titulo}</h2>
              <a href="listado.html?seccion=${seccion.clave}" class="text-sm text-gray-400 hover:text-white transition whitespace-nowrap">
                Ver todo →
              </a>
            </div>
          </div>
          <div class="relative">
            <div id="${idCarrusel}" class="carrusel-scroll flex gap-4 overflow-x-auto px-4 md:px-8 pb-2"
                 onmouseenter="pausarCarrusel('${idCarrusel}')" onmouseleave="reanudarCarrusel('${idCarrusel}')">
              ${productosSeccion.map(p => `
                <div onclick="window.location.href='producto.html?id=${p.id}'"
                     class="flex-shrink-0 w-44 md:w-56 bg-zinc-900 rounded-xl p-3 cursor-pointer hover:scale-105 transition duration-300">
                  <div class="relative">
                    <img src="${p.imagenes[0]}" alt="${p.nombre}" loading="lazy" class="rounded-lg mb-3 w-full h-40 md:h-56 object-cover">
                    <button onclick="event.stopPropagation(); toggleFavorito('${p.id}', this)"
                            class="favorito-btn absolute top-2 right-2 w-8 h-8 rounded-full bg-black/50 flex items-center justify-center text-lg">
                      ${favoritosUsuario.includes(p.id) ? '❤️' : '🤍'}
                    </button>
                  </div>
                  <p class="text-sm font-semibold truncate">${p.nombre}</p>
                  <p class="text-gray-400 text-xs">$${p.precio} MXN</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
        contenedor.appendChild(bloque);

        iniciarAutoScroll(idCarrusel);
      });
    }

    // ===== CARRUSEL AUTOMÁTICO + DESLIZABLE =====
    const intervalosCarrusel = {};

    function iniciarAutoScroll(idCarrusel) {
      intervalosCarrusel[idCarrusel] = setInterval(() => {
        const el = document.getElementById(idCarrusel);
        if (!el) return;
        const maxScroll = el.scrollWidth - el.clientWidth;
        if (el.scrollLeft >= maxScroll - 5) {
          el.scrollTo({ left: 0, behavior: 'smooth' });
        } else {
          el.scrollBy({ left: 220, behavior: 'smooth' });
        }
      }, 3000);
    }

    function pausarCarrusel(idCarrusel) {
      clearInterval(intervalosCarrusel[idCarrusel]);
    }

    function reanudarCarrusel(idCarrusel) {
      iniciarAutoScroll(idCarrusel);
    }

    // ===== CARRITO =====
    function guardarCarrito() {
      sessionStorage.setItem('carrito', JSON.stringify(carrito));
    }

    function actualizarCarritoUI() {
      const contador = document.getElementById('contadorCarrito');
      const totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);
      contador.textContent = totalItems;

      const carritoItems = document.getElementById('carritoItems');
      const carritoVacio = document.getElementById('carritoVacio');
      const carritoTotal = document.getElementById('carritoTotal');

      if (carrito.length === 0) {
        carritoItems.innerHTML = '';
        carritoVacio.classList.remove('hidden');
        carritoTotal.classList.add('hidden');
        return;
      }

      carritoVacio.classList.add('hidden');
      carritoTotal.classList.remove('hidden');

      let total = 0;
      carritoItems.innerHTML = carrito.map(item => {
        total += item.precio * item.cantidad;
        return `
          <div class="flex gap-3 items-center bg-zinc-800 rounded-lg p-3">
            <img src="${item.imagenes[0]}" class="w-16 h-16 object-cover rounded">
            <div class="flex-1">
              <p class="text-sm font-medium">${item.nombre}</p>
              <p class="text-xs text-gray-400">Talla: ${item.talla || 'Única'} · $${item.precio} MXN</p>
              <div class="flex items-center gap-2 mt-1">
                <button onclick="cambiarCantidad('${item.claveUnica || item.id}', -1)" class="bg-zinc-700 w-6 h-6 rounded text-sm">-</button>
                <span class="text-sm">${item.cantidad}</span>
                <button onclick="cambiarCantidad('${item.claveUnica || item.id}', 1)" class="bg-zinc-700 w-6 h-6 rounded text-sm">+</button>
              </div>
            </div>
            <button onclick="quitarDelCarrito('${item.claveUnica || item.id}')" class="text-red-500 text-sm">✕</button>
          </div>`;
      }).join('');

      document.getElementById('totalPrecio').textContent = `$${total} MXN`;
    }

    function obtenerStockLocal(productoId, talla) {
      const producto = todosLosProductos.find(p => p.id === productoId);
      if (!producto) return null;
      if (producto.tallas && producto.tallas.length > 0 && typeof producto.tallas[0] === 'object') {
        const t = producto.tallas.find(t => t.nombre === talla);
        return t ? t.stock : 0;
      }
      return producto.stock || 0;
    }

    function cambiarCantidad(clave, delta) {
      const item = carrito.find(i => (i.claveUnica || i.id) === clave);
      if (!item) return;

      if (delta > 0) {
        const stock = obtenerStockLocal(item.id, item.talla);
        if (stock !== null && item.cantidad >= stock) {
          alert(`No hay más stock disponible de "${item.nombre}" (talla ${item.talla}). Stock: ${stock}.`);
          return;
        }
      }

      item.cantidad += delta;
      if (item.cantidad <= 0) {
        quitarDelCarrito(clave);
      } else {
        guardarCarrito();
        actualizarCarritoUI();
      }
    }

    function quitarDelCarrito(clave) {
      carrito = carrito.filter(item => (item.claveUnica || item.id) !== clave);
      guardarCarrito();
      actualizarCarritoUI();
    }

    function toggleCarrito() {
      document.getElementById('carritoOverlay').classList.toggle('hidden');
    }

    function toggleMenuMovil() {
      document.getElementById('sidebarMovil').classList.toggle('hidden');
    }

    document.getElementById('btnMenuMovil').addEventListener('click', toggleMenuMovil);

    // ===== FAVORITOS =====
    async function cargarFavoritos() {
      if (!usuarioActual) {
        favoritosUsuario = [];
        return;
      }
      try {
        const snapshot = await db.collection('usuarios').doc(usuarioActual.uid).collection('favoritos').get();
        favoritosUsuario = snapshot.docs.map(doc => doc.id);
      } catch (error) {
        console.error('Error al cargar favoritos:', error);
        favoritosUsuario = [];
      }
    }

    async function toggleFavorito(productoId, btn) {
      if (!usuarioActual) {
        if (confirm('Necesitas iniciar sesión para guardar favoritos. ¿Iniciar sesión ahora?')) {
          iniciarSesionGoogle();
        }
        return;
      }

      const ref = db.collection('usuarios').doc(usuarioActual.uid).collection('favoritos').doc(productoId);
      const yaEsFavorito = favoritosUsuario.includes(productoId);

      try {
        if (yaEsFavorito) {
          await ref.delete();
          favoritosUsuario = favoritosUsuario.filter(id => id !== productoId);
          btn.textContent = '🤍';
        } else {
          await ref.set({ fecha: firebase.firestore.FieldValue.serverTimestamp() });
          favoritosUsuario.push(productoId);
          btn.textContent = '❤️';
        }
      } catch (error) {
        alert('Error al actualizar favoritos: ' + error.message);
      }
    }

    function actualizarVisibilidadFavoritos() {
      const liDesktop = document.getElementById('liFavoritosDesktop');
      const liMovil = document.getElementById('liFavoritosMovil');
      const visible = usuarioActual ? '' : 'none';
      if (liDesktop) liDesktop.style.display = visible;
      if (liMovil) liMovil.style.display = visible;
    }

    function irAFavoritos() {
      window.location.href = 'listado.html?favoritos=1';
    }

    // ===== LOGIN USUARIO (Google) =====
    function iniciarSesionGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(error => {
        console.error('Error al iniciar sesión:', error);
      });
    }

    function cerrarSesionUsuario() {
      auth.signOut();
    }

    auth.onAuthStateChanged(user => {
      usuarioActual = user;

      const linkAdmin = document.getElementById('linkAdmin');
      if (user && user.email === 'ephemeralpagweb@gmail.com') {
        linkAdmin.classList.remove('hidden');
      } else {
        linkAdmin.classList.add('hidden');
      }

      const btnLogin = document.getElementById('btnLogin');
      const usuarioInfo = document.getElementById('usuarioInfo');
      const fotoUsuario = document.getElementById('fotoUsuario');

      const btnLoginMovil = document.getElementById('btnLoginMovil');
      const usuarioInfoMovil = document.getElementById('usuarioInfoMovil');
      const fotoUsuarioMovil = document.getElementById('fotoUsuarioMovil');
      const nombreUsuarioMovil = document.getElementById('nombreUsuarioMovil');

      if (user) {
        btnLogin.classList.add('hidden');
        usuarioInfo.classList.remove('hidden');
        usuarioInfo.classList.add('flex');
        fotoUsuario.src = user.photoURL || 'images/Logo.png';

        btnLoginMovil.classList.add('hidden');
        usuarioInfoMovil.classList.remove('hidden');
        usuarioInfoMovil.classList.add('flex');
        fotoUsuarioMovil.src = user.photoURL || 'images/Logo.png';
        nombreUsuarioMovil.textContent = user.displayName || user.email;
      } else {
        btnLogin.classList.remove('hidden');
        usuarioInfo.classList.add('hidden');
        usuarioInfo.classList.remove('flex');

        btnLoginMovil.classList.remove('hidden');
        usuarioInfoMovil.classList.add('hidden');
        usuarioInfoMovil.classList.remove('flex');
      }

      actualizarVisibilidadFavoritos();
      cargarFavoritos().then(() => renderizarSecciones());
    });

    window.addEventListener('DOMContentLoaded', cargarProductos);
  </script>

</body>
</html>
